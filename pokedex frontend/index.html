<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="shell">
    <div class="shell__top">
      <span class="shell__lens" aria-hidden="true"></span>
      <h1 class="shell__title">Pokédex</h1>
      <span class="shell__count" id="resultCount">898 registros</span>
    </div>

    <div class="shell__controls">
      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Buscar por nombre o número…"
        autocomplete="off"
      >
    </div>

    <div class="chips" id="typeChips" role="group" aria-label="Filtrar por tipo"></div>
  </header>

  <main class="screen">
    <div class="grid" id="grid"></div>

    <p class="empty" id="emptyState" hidden>No se encontró ningún Pokémon con esos filtros.</p>

    <button class="loadMore" id="loadMoreBtn">Cargar más</button>
  </main>

  <aside class="detail" id="detailPanel" aria-hidden="true">
    <div class="detail__scrim" id="detailScrim"></div>
    <div class="detail__panel" role="dialog" aria-modal="true" aria-labelledby="detailName">
      <button class="detail__close" id="detailClose" aria-label="Cerrar">✕</button>
      <div id="detailContent"></div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
